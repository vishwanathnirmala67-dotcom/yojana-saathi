<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yojana Saathi</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1c1f2a; --accent:#ff7a1a; --green:#138808; --line:#e3e6ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161d; --card:#1f222c; --ink:#eef0f6; --line:#2e3240; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 16px; background:linear-gradient(90deg,var(--accent),#fff 50%,var(--green)); color:#111; font-weight:700; }
  header small { display:block; font-weight:400; opacity:.8; }
  #chat { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:14px; background:var(--card); border:1px solid var(--line); white-space:pre-wrap; line-height:1.45; }
  .me { align-self:flex-end; background:var(--accent); color:#fff; border:none; }
  .steps { font-size:12px; opacity:.75; margin-top:6px; }
  .chip { display:inline-block; padding:2px 8px; margin:2px 4px 0 0; border-radius:10px; background:var(--line); }
  .samples { display:flex; gap:6px; flex-wrap:wrap; padding:0 12px 6px; }
  .samples button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:16px; padding:6px 10px; font-size:13px; }
  #bar { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:var(--card); }
  #msg { flex:1; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; }
  #send { padding:0 18px; border:none; border-radius:12px; background:var(--green); color:#fff; font-size:16px; }
  a { color:var(--green); font-weight:600; }
</style>
</head>
<body>
<header>🇮🇳 Yojana Saathi<small>Sarkari yojana dhundo, documents jaano, application banao</small></header>
<div id="chat"></div>
<div class="samples" id="samples"></div>
<div id="bar"><input id="msg" placeholder="Apni baat likhiye..." autocomplete="off"><button id="send">Bhejein</button></div>
<script>
const sid = "s" + Math.random().toString(36).slice(2);
const chat = document.getElementById("chat"), input = document.getElementById("msg");
const samples = ["Main 45 saal ka kisan hoon, income 1.5 lakh", "Main SC student hoon, income 2 lakh", "Main mahila hoon, pregnant hoon", "Mera thela hai, 30 saal"];
samples.forEach(s => { const b = document.createElement("button"); b.textContent = s; b.onclick = () => send(s); document.getElementById("samples").appendChild(b); });

function add(text, cls, extra) {
  const d = document.createElement("div"); d.className = "msg " + (cls || ""); d.textContent = text;
  if (extra) d.appendChild(extra);
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
async function send(text) {
  text = (text || input.value).trim(); if (!text) return;
  input.value = ""; add(text, "me");
  const wait = add("Soch raha hoon...");
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, session_id: sid }) });
    const data = await r.json();
    wait.remove();
    const box = document.createElement("div"); box.className = "steps";
    (data.steps || []).forEach(s => { const c = document.createElement("span"); c.className = "chip"; c.textContent = "🔧 " + s.tool + ": " + s.summary; box.appendChild(c); });
    (data.drafts || []).forEach(id => { const a = document.createElement("a"); a.href = "/draft/" + id; a.textContent = "📄 Letter download karein"; a.style.display = "block"; a.style.marginTop = "6px"; box.appendChild(a); });
    add(data.reply, "", box);
  } catch (e) { wait.textContent = "Error: server se connect nahi hua."; }
}
document.getElementById("send").onclick = () => send();
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
add("Namaste! 🙏 Apni situation bataiye (umar, kaam, income, state). Main aapke liye sahi sarkari yojana dhundhunga.");
</script>
</body>
</html>
